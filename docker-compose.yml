# Compose para el Nodo A: coordinador + redis + minio + reaper, sin workers.
# NODE_IP es la IP de Tailscale del Nodo A: los puertos se publican solo en esa interfaz.
#   docker compose up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: redis-server
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}", "--appendonly", "yes"]
    ports:
      - "${NODE_IP:?define NODE_IP en .env}:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${NODE_IP:?define NODE_IP en .env}:9000:9000"
      - "${NODE_IP:?define NODE_IP en .env}:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "uvicorn", "src.coordinator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${NODE_IP:?define NODE_IP en .env}:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  reaper:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "scripts.reaper"]
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COORDINATOR_URL: http://coordinator:8000
    depends_on:
      redis:
        condition: service_healthy
      coordinator:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  minio-data:
