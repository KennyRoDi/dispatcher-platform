# Compose para probar todo el sistema en UNA sola maquina (integracion F2):
# redis + minio + coordinator + reaper + 3 workers, todo con valores por defecto
# (no requiere .env; usa las mismas variables que .env.example con fallback ${VAR:-default}).
# Cada worker tiene su propio scratch: el arranque de un worker borra todo WORK_DIR.
x-worker: &worker
  build:
    context: ..
    dockerfile: Dockerfile.worker
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777
  environment:
    TLS_ENABLED: "false"
    REDIS_HOST: redis
    REDIS_PORT: 6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
    COORDINATOR_URL: http://coordinator:8000
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    WORK_DIR: /scratch
    WORKER_CONCURRENCY: 1
    HEARTBEAT_INTERVAL: 5
  depends_on:
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    coordinator:
      condition: service_started
  restart: unless-stopped

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-localdev}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-localdev}
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  coordinator:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "uvicorn", "src.coordinator.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TLS_ENABLED: "false"
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      OBJECTS_BUCKET: ${OBJECTS_BUCKET:-objetos}
      STAGING_DIR: /var/lib/dispatcher/staging
      KEK_FILE: ${KEK_FILE:-}
      KEK: ${KEK:-}
    ports:
      - "8000:8000"
    volumes:
      - coordinator-staging:/var/lib/dispatcher/staging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  reaper:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    command: ["python", "-m", "scripts.reaper"]
    environment:
      TLS_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-localdev}
      COORDINATOR_URL: http://coordinator:8000
    depends_on:
      redis:
        condition: service_healthy
      coordinator:
        condition: service_started
    restart: unless-stopped

  worker-1:
    <<: *worker
    volumes:
      - scratch-1:/scratch

  worker-2:
    <<: *worker
    volumes:
      - scratch-2:/scratch

  worker-3:
    <<: *worker
    volumes:
      - scratch-3:/scratch

volumes:
  scratch-1:
  scratch-2:
  scratch-3:
  coordinator-staging:
