# Compose para los nodos B/C/D: un worker que apunta al Nodo A via .env
# (REDIS_HOST / COORDINATOR_URL / MINIO_ENDPOINT deben ser la IP de Tailscale del Nodo A).
# --env-file es necesario: el archivo esta en deploy/ y Compose no buscaria alli el .env de la raiz.
#   docker compose --env-file .env -f deploy/docker-compose.worker.yml up -d --build
#
# hostname fijo: varias replicas compartirian worker_id, asi que no se usa --scale.
# La concurrencia del nodo se ajusta con WORKER_CONCURRENCY.

services:
  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    hostname: ${NODE_NAME:?define NODE_NAME en .env}
    env_file: ../.env
    mem_limit: ${WORKER_MEM_LIMIT:?define WORKER_MEM_LIMIT en .env}
    memswap_limit: ${WORKER_MEM_LIMIT:?define WORKER_MEM_LIMIT en .env}
    environment:
      WORK_DIR: /scratch
      NODE_IP: ${NODE_IP:?define NODE_IP en .env}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - scratch:/scratch
    tmpfs:
      - /tmp:size=64m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # El worker termina la subtarea en curso antes de salir (SIGTERM -> stop_event); el timeout
    # proporcional de FFmpeg puede llegar al tope de 1800 s (30 min), asi que 31m cubre el peor caso
    # sin que Docker mande SIGKILL a mitad de un transcode.
    stop_grace_period: 31m

volumes:
  scratch:
